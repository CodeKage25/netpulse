[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netpulse-monitor"
version = "0.4.0"
description = "Local-first monitoring for any home connection - MTN broadband, Starlink, fibre, anything with a gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CodeKage25" }]
keywords = ["network", "monitoring", "lte", "5g", "router", "huawei", "starlink", "mtn"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Networking :: Monitoring",
]
# The collector, the dashboard and every adapter are stdlib-only on purpose: the whole
# thing must install and run on a Raspberry Pi with nothing else, and keep working
# during the outage it exists to explain.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
netpulse = "netpulse.cli:main"

[project.urls]
Homepage = "https://github.com/CodeKage25/netpulse"

[tool.hatch.build.targets.wheel]
packages = ["netpulse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
